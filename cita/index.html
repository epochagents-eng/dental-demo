<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e7490">
<meta name="robots" content="noindex">
<title>Mi cita - Clínica Dental de la Doctora Anita</title>
<link rel="stylesheet" href="../estilos.css?v=4">
<style>
  .pagina {
    flex: 1 1 auto;
    display: flex;
    flex-direction: column;
    gap: 14px;
    padding: 18px 16px calc(20px + env(safe-area-inset-bottom));
  }
  .pagina h2 { margin: 0; font-size: 21px; line-height: 1.25; color: #0e7490; }
  #zona { display: flex; flex-direction: column; gap: 12px; }
  .cita { align-self: stretch; }
  .cita dl { font-size: 15px; }
  .nota { margin: 0; font-size: 13px; line-height: 1.45; color: #5b7480; }
  .acciones { display: flex; flex-direction: column; gap: 10px; margin-top: 2px; }
  .acciones button {
    width: 100%;
    padding: 13px 16px;
    font: inherit;
    font-weight: 600;
    border: 1px solid #c2413b;
    border-radius: 10px;
    background: #fff;
    color: #c2413b;
    cursor: pointer;
  }
  .acciones button.peligro { background: #c2413b; border-color: #c2413b; color: #fff; }
  .acciones button:disabled { opacity: .5; cursor: default; }
  .volver {
    margin-top: auto;
    padding-top: 8px;
    text-align: center;
    font-size: 14px;
    color: #0e7490;
    text-decoration: none;
  }
  .volver:active { text-decoration: underline; }
  .espera-texto { margin: 0; font-size: 15px; color: #5b7480; }
</style>
</head>
<body>

<header class="cabecera">
  <div class="cabecera-texto">
    <h1 id="nombre">Clínica Dental</h1>
    <p id="direccion" class="dato"></p>
    <p class="dato"><a id="telefono" class="tel" href="#"></a></p>
  </div>
</header>

<main class="pagina">
  <div id="zona">
    <p class="espera-texto">Buscando tu cita…</p>
  </div>
  <a class="volver" href="../">Volver al chat</a>
</main>

<script src="cita.js?v=5"></script>
</body>
</html>
